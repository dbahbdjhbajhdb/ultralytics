# Five-column YOLO labels + same-name occlusion JSON sidecars.
# Expected folders: images/train, images/val, labels/train, labels/val,
#                   occlusion/train, occlusion/val (metadata/ is also accepted).
# Change only path if your dataset is stored elsewhere. No download hook.
path: C:/date/VisDrone_occ
train: images/train
val: images/val

names:
  0: pedestrian
  1: people
  2: bicycle
  3: car
  4: van
  5: truck
  6: tricycle
  7: awning-tricycle
  8: bus
  9: motor
